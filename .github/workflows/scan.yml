name: Pricempire 24/7 Real Scanner

on:
  schedule:
    - cron: '*/5 * * * *'  # Quét tự động mỗi 5 phút
  workflow_dispatch:

jobs:
  scan-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt Playwright & Pillow
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          playwright install chromium --with-deps

      - name: Chạy trình duyệt quét giá trực tiếp từ Pricempire
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_PRICE: '100'
          MAX_PRICE: '1000'
        run: python scanner.py
