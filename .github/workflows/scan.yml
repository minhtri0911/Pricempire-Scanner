name: Pricempire 24/7 Browser Scanner

on:
  schedule:
    # Tự động mở trình duyệt lướt web mỗi 15 phút (24/7)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  browser-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt trình duyệt Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Chạy trình duyệt tự động quét giá Pricempire
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_PRICE: '100'
          MAX_PRICE: '1000'
        run: python scanner.py
