name: Pricempire 24/7 Cloudflare-Bypass Scanner

on:
  schedule:
    # Quét tự động mỗi 5 phút một lần (24/7)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  bypass-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện vượt Cloudflare (curl_cffi & Pillow)
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pillow

      - name: Chạy quét giá thật vượt Cloudflare từ Pricempire
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_PRICE: '100'
          MAX_PRICE: '1000'
        run: python scanner.py
