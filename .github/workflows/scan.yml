name: Pricempire 24/7 Scanner

on:
  schedule:
    # Tự động quét mỗi 5 phút một lần (24/7)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện vẽ ảnh
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Chạy quét giá Pricempire
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_PRICE: '100'
          MAX_PRICE: '1000'
        run: python scanner.py
